kind = "web"
previewPath = "/"
title = "FIKR — Financial Literacy Platform"
version = "1.0.0"
id = "artifacts/fikr"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19597

[services.development]
run = "pnpm --filter @workspace/fikr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fikr", "run", "build" ]
serve = "static"
publicDir = "artifacts/fikr/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19597"
BASE_PATH = "/"
